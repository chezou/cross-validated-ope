dataset:
  eval_model_split: 0.5
  kwargs:
    behavior_policy: random
    campaign: all
  module: openbandit
  preprocessing:
  - kwargs: {}
    name: ordinal_label
estimators:
- hyperparameters: {}
  kwargs: {}
  name: IPS
  printname: IPS
  tuning: null
- hyperparameters: {}
  kwargs: {}
  name: DM
  printname: DM
  tuning: null
- hyperparameters: {}
  kwargs: {}
  name: DR
  printname: DR
  tuning: null
- hyperparameters:
  - estimator:
    - IPS
    - DM
    - DR
  kwargs: {}
  name: EstimatorSelection
  printname: OCV$_{\mathregular{IPS}}$
  tuning:
    kwargs:
      valid_estimator: IPS
    tuner: OCV
- hyperparameters:
  - estimator:
    - IPS
    - DM
    - DR
  kwargs: {}
  name: EstimatorSelection
  printname: OCV$_{\mathregular{DR}}$
  tuning:
    kwargs:
      valid_estimator: DR
    tuner: OCV
- hyperparameters:
  - estimator:
    - IPS
    - DR
    - DM
  kwargs: {}
  name: EstimatorSelection
  printname: SLOPE
  tuning:
    kwargs: {}
    tuner: SLOPE
- hyperparameters:
  - estimator:
    - IPS
    - DM
    - DR
  kwargs: {}
  name: EstimatorSelection
  printname: PAS-IF
  tuning:
    kwargs: {}
    tuner: PASIF
experiment:
  ablation: {}
  directory: openbandit_example
  n_iter: 5
logging_policy:
  kwargs:
    preprocessing:
    - kwargs:
        n: 1.0
        replace: true
      name: subsample
  name: obp_random
plot:
  figsize:
  - 4
  - 2.6666666666666665
  ignore_estimators: null
  title: Performance on Open Bandit Dataset
  type: barplot
  use_latex: false
  xlabel: null
  xscale: linear
  xvar: null
  ylabel: MSE
  yscale: log
  yvar: MSE
sampler: {}
target_policy:
  kwargs:
    epsilon: 0.1
    preprocessing:
    - kwargs:
        n: 1.0
        replace: true
      name: subsample
  name: obp_linucb
