experiment:
  directory: openbandit_example
  n_iter: 5
dataset:
  module: openbandit
  kwargs:
    behavior_policy: random
    campaign: all
  preprocessing:
    - name: ordinal_label
  eval_model_split: 0.5
logging_policy:
  name: obp_random
  kwargs:
    preprocessing:
      - name: subsample
        kwargs:
          n: 1.0
          replace: True
target_policy:
  name: obp_linucb
  kwargs:
    epsilon: 0.1
    preprocessing:
      - name: subsample
        kwargs:
          n: 1.0
          replace: True
estimators:
  - name: IPS
  - name: DM
  - name: DR
  - name: EstimatorSelection
    printname: OCV$_{\mathregular{IPS}}$
    hyperparameters:
      - estimator: [IPS, DM, DR]
    tuning:
      tuner: OCV
      kwargs:
        valid_estimator: IPS
  - name: EstimatorSelection
    printname: OCV$_{\mathregular{DR}}$
    hyperparameters:
      - estimator: [IPS, DM, DR]
    tuning:
      tuner: OCV
      kwargs:
        valid_estimator: DR
  - name: EstimatorSelection
    printname: SLOPE
    hyperparameters:
      - estimator: [IPS, DR, DM]
    tuning:
      tuner: SLOPE
  - name: EstimatorSelection
    printname: PAS-IF
    hyperparameters:
      - estimator: [IPS, DM, DR]
    tuning:
      tuner: PASIF
plot:
  type: barplot
  title: Performance on Open Bandit Dataset
  use_latex: False
