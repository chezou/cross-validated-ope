[project]
name = "cross-validated-ope"
version = "0.1.0"
description = "Cross-Validated Off-Policy Evaluation"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch",
    "pandas>=1.5.0,<2.0",
    "numpy",
    "matplotlib",
    "seaborn",
    "scikit-learn>=1.5.0",
    "tqdm",
    "scipy",
    "dacite",
    "sb-obp>=0.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
